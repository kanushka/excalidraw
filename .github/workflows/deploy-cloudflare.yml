name: Deploy to Cloudflare Pages

# Builds the app with multiple canvases enabled and deploys it, together with
# the canvas API in ./functions, to the Cloudflare Pages project "excalidraw".
# Needs the repository secrets CLOUDFLARE_API_TOKEN (permissions: Cloudflare
# Pages Edit, D1 Edit) and CLOUDFLARE_ACCOUNT_ID. See cloudflare/README.md.

on:
  push:
    branches: master
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'kanushka/excalidraw'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
      - name: Install
        run: yarn --frozen-lockfile
      - name: Build
        run: yarn build:app:docker
        env:
          VITE_APP_CANVAS_API_URL: /api
      - name: Apply database schema
        run: npx wrangler@4 d1 execute excalidraw --remote --file=cloudflare/schema.sql
      - name: Create Pages project (first deploy only)
        run: npx wrangler@4 pages project create excalidraw --production-branch=master || true
      - name: Deploy
        run: npx wrangler@4 pages deploy --project-name=excalidraw --branch=master
